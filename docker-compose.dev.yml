services:
  service:
    container_name: 'dev-service-mini-note'
    build: 
      context: .
      dockerfile: development.dockerfile
    ports:
      - '9077:9077'
    volumes:
      - ./src:/app
#      - ./.env.test:/app/.env
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: 'mongo:6.0'
    container_name: 'dev-service-mini-note-mongo'
    ports:
      - '27297:27017'
    volumes:
      - ./mongodb:/data/db
    restart: unless-stopped

networks:
  default:
    external: true
    name: mini_note_network
