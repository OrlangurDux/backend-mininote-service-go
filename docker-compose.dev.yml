services:
  service:
    container_name: 'dev-service-mini-note'
    build: 
      context: .
      dockerfile: development.dockerfile
    ports:
      - '9077:9077'
    volumes:
      - ./src:/app
#      - ./.env.test:/app/.env
    depends_on:
      - mongo
      - smtp
    restart: unless-stopped

  smtp:
    image: axllent/mailpit:latest
    container_name: 'dev-service-mini-note-smtp'
    volumes:
      - ./mailpit:/data
    ports:
      - '1025:1025'
      - '8025:8025'
      - '1110:1110'
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    restart: unless-stopped

  mongo:
    image: 'mongo:6.0'
    container_name: 'dev-service-mini-note-mongo'
    ports:
      - '27297:27017'
    volumes:
      - ./mongodb:/data/db
    restart: unless-stopped

  redis:
    image: 'redis:8.10.1-alpine'
    container_name: 'dev-service-mini-note-redis'
    ports:
      - '7379:6379'
    restart: unless-stopped

networks:
  default:
    external: true
    name: mini_note_network
