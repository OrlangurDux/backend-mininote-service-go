name: Test

on:
  push:
    branches: [0.1.x-dev]
  pull_request:
    branches: [0.1.x-dev]

jobs:
  test:
    strategy:
      matrix:
        go-version: [ 1.26.x ]
        os: [ ubuntu-22.04 ]
        mongodb-version: [6.0]
    runs-on: ${{ matrix.os }}

    services:
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025 # SMTP port
          - 8025:8025 # HTTP API/Web UI port
        env:
          MP_MAX_MESSAGES: 5000
          MP_SMTP_AUTH_ACCEPT_ANY: 1
          MP_SMTP_AUTH_ALLOW_INSECURE: 1

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v2

      - name: Set up Go
        uses: actions/setup-go@v2
        with:
          go-version: ${{ matrix.go-version }}

      - name: Create environment
        run: cd src/ && cp .env.default .env.test

      - name: Verify dependencies
        run: cd src/ && go mod verify

      - name: Build
        run: cd src/ && go build -v ./...

      - name: Run go vet
        run: cd src/ && go vet ./...

      - name: Install staticcheck
        run: cd src/ && go install honnef.co/go/tools/cmd/staticcheck@v0.7.0

      - name: Run staticcheck
        run: cd src/ && staticcheck ./...

      - name: Install golint
        run: cd src/ && go install golang.org/x/lint/golint@latest

      - name: Run golint
        run: cd src/ && golint ./...

      - name: Start MongoDB
        uses: supercharge/mongodb-github-action@1.3.0
        with:
          mongodb-version: ${{ matrix.mongodb-version }}

      - name: Run tests
        env:
          SMTP_HOST: ${{secrets.SMTP_HOST}}
          SMTP_LOGIN: ${{secrets.SMTP_LOGIN}}
          SMTP_PASSWORD: ${{secrets.SMTP_PASSWORD}}
          SMTP_PORT: ${{secrets.SMTP_PORT}}
          SMTP_TO: ${{secrets.SMTP_TO}}
        run: cd src/tests && go test -v -race -vet=off ./...